name: Publish local bone-age app

on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/export_web_model.py', 'scripts/check_site.py', 'requirements-web.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache validated ONNX models
        id: models
        uses: actions/cache@v4
        with:
          path: web/public/models
          key: bone-age-onnx-fp32-${{ hashFiles('scripts/export_web_model.py', 'requirements-web.txt') }}
      - name: Install CPU export dependencies
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-web.txt
      - name: Convert and numerically validate all three networks
        if: steps.models.outputs.cache-hit != 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        run: python scripts/export_web_model.py
      - name: Build and test browser app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify public artifact contains only app and public model assets
        run: python scripts/check_site.py web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
